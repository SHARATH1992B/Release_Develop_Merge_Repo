name: Sonar

on:
  workflow_run:
    workflows: ["Install Dependencies"]
    types: [completed]

jobs:
  sonar:
    name: SonarCloud
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Mark check as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Sonar / SonarCloud',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress'
            });

      - name: Checkout the exact commit that triggered Install Dependencies
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # github.event.workflow_run.id is the exact run ID of the Install
      # Dependencies run that triggered this job - so this key always matches
      # the one that run saved under, with no ambiguity from the lock file.
      # Note: because this job runs via workflow_run, its branch context is
      # the default branch, which can mean the cache saved under the PR's
      # branch scope isn't visible here (a documented branch-scoping behavior
      # of actions/cache). The fallback step below keeps this job reliable
      # either way.
      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ github.event.workflow_run.id }}

      - name: Install dependencies (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache not visible here - installing dependencies as a fallback."
          time npm ci

      - name: Confirm dependencies are present
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          du -sh node_modules

      - name: Simulate Sonar-style analysis step
        id: run_sonar
        run: echo "Running Sonar-like analysis using the available dependencies..."

      - name: Mark check as completed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.run_sonar.outcome }}' === 'success' ? 'success' : 'failure';
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });
            const check = checks.data.check_runs.find(c => c.name === 'Sonar / SonarCloud');
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: conclusion
              });
            }
