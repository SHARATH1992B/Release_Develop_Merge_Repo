name: Sonar

# Does NOT trigger on pull_request directly - it triggers automatically once
# the "Install Dependencies" workflow finishes. This is what lets Sonar and
# Unit Tests run in parallel with each other, right after install, while
# staying in a completely separate file (per Hamza's requirement).
on:
  workflow_run:
    workflows: ["Install Dependencies"]
    types: [completed]

jobs:
  sonar:
    name: SonarCloud
    # Only proceed if Install Dependencies actually succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      # workflow_run does NOT automatically create a PR check like
      # pull_request-triggered workflows do. This step manually creates one,
      # tied to the exact commit that triggered Install Dependencies, so it
      # shows up on the PR just like it would with a normal pull_request trigger.
      - name: Mark check as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Sonar / SonarCloud',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress'
            });

      # Must explicitly checkout the commit that triggered the upstream run -
      # workflow_run does not automatically check out the right commit.
      - name: Checkout the exact commit that triggered Install Dependencies
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      - name: Confirm dependencies were restored, not reinstalled
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          du -sh node_modules

      - name: Simulate Sonar-style analysis step
        id: run_sonar
        run: echo "Running Sonar-like analysis using the already-installed dependencies..."

      - name: Mark check as completed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.run_sonar.outcome }}' === 'success' ? 'success' : 'failure';
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });
            const check = checks.data.check_runs.find(c => c.name === 'Sonar / SonarCloud');
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: conclusion
              });
            }
