name: Sonar

on:
  workflow_run:
    workflows: ["Install Dependencies"]
    types: [completed]

jobs:
  sonar:
    name: SonarCloud
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - name: Mark check as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Sonar / SonarCloud',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress'
            });

      - name: Checkout the exact commit that triggered Install Dependencies
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # actions/cache is not reliable here because this job's ref context
      # differs from the PR branch that Install Dependencies ran on. Instead,
      # download the exact artifact that specific run produced, using its run ID.
      - name: Download node_modules artifact from Install Dependencies run
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz

      - name: Confirm dependencies were restored, not reinstalled
        run: du -sh node_modules

      - name: Simulate Sonar-style analysis step
        id: run_sonar
        run: echo "Running Sonar-like analysis using the already-installed dependencies..."

      - name: Mark check as completed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.run_sonar.outcome }}' === 'success' ? 'success' : 'failure';
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });
            const check = checks.data.check_runs.find(c => c.name === 'Sonar / SonarCloud');
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: conclusion
              });
            }
