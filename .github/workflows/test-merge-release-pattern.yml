name: Auto-merge release branch to develop (TEST)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * *'

jobs:
  merge:
    name: Detect release branch and merge into develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # BRANCH DETECTION
      # Matches release/<anything>-<4-digit year>  e.g. release/1.1.0-2026
      #
      # FIX: `git branch -r` pads every line with leading whitespace
      # (e.g. "  origin/release/1.1.0-2026"). The earlier version only
      # stripped the "origin/" prefix and left the leading spaces in
      # place, so the ^release/ anchor in grep never matched anything.
      # The extra `sed 's/^[[:space:]]*//'` below trims that whitespace
      # before the pattern check runs.
      # ============================================================
      - name: Identify release branch
        id: release_branch
        run: |
          git fetch origin --prune
          BRANCH=$(git branch -r \
            | sed 's|origin/||' \
            | sed 's/^[[:space:]]*//' \
            | grep -E '^release/.*-[0-9]{4}$' \
            | sort -V \
            | tail -n1 \
            | xargs)
          if [ -z "$BRANCH" ]; then
            echo "No branch matching release/*-YYYY found. Skipping merge."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Detected release branch: $BRANCH"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        if: steps.release_branch.outputs.found == 'true'
        id: do_merge
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          if git merge --no-ff "origin/$BRANCH" -m "Automated merge: $BRANCH -> main"; then
            git push origin main
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Report result
        if: always()
        run: |
          echo "Branch detected: ${{ steps.release_branch.outputs.branch }}"
          echo "Merge result: ${{ steps.do_merge.outputs.status }}"

      - name: Fail job if conflict occurred
        if: steps.do_merge.outputs.status == 'conflict'
        run: exit 1

      # ============================================================
      # TEAMS NOTIFICATIONS
      #
      # NOTE: Microsoft retired the old "Incoming Webhook" connector
      # for Teams. As of mid-2026, new webhooks must be created via
      # the Workflows app (Power Automate) using a
      # "post to a channel when a webhook request is received"
      # template, which gives you a webhook URL to POST to. The
      # payload format below uses the Adaptive Card schema, which
      # the Workflows webhook expects.
      #
      # Two separate notification steps: one for success, one for
      # conflict. Only one of the two will ever fire per run, since
      # each checks the opposite merge result.
      # ============================================================
      - name: Notify Teams on success
        if: always() && steps.do_merge.outputs.status == 'success'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "✅ Auto-merge succeeded",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} → main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "No conflicts. main is up to date with the latest release branch.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams on conflict
        if: always() && steps.do_merge.outputs.status == 'conflict'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "⚠️ Auto-merge failed: conflict detected",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "attention"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} → main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Manual merge required. develop/main was NOT modified.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
