name: Auto-merge release branch to develop (TEST)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * *'

jobs:
  merge:
    name: Detect release branch and merge into develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      - name: Identify release branch
        id: release_branch
        run: |
          git fetch origin --prune
          BRANCH=$(git branch -r \
            | sed 's|origin/||' \
            | sed 's/^[[:space:]]*//' \
            | grep -E '^release/.*-[0-9]{4}$' \
            | sort -V \
            | tail -n1 \
            | xargs)
          if [ -z "$BRANCH" ]; then
            echo "No branch matching release/*-YYYY found. Skipping merge."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Detected release branch: $BRANCH"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        if: steps.release_branch.outputs.found == 'true'
        id: do_merge
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          if git merge --no-ff "origin/$BRANCH" -m "Automated merge: $BRANCH -> main"; then
            git push origin main
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Report result
        if: always()
        run: |
          echo "Branch detected: ${{ steps.release_branch.outputs.branch }}"
          echo "Merge result: ${{ steps.do_merge.outputs.status }}"

      - name: Fail job if conflict occurred
        if: steps.do_merge.outputs.status == 'conflict'
        run: exit 1


      - name: Notify Teams on success
        if: always() && steps.do_merge.outputs.status == 'success'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "✅ Auto-merge succeeded",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} → main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "No conflicts. main is up to date with the latest release branch.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams on conflict
        if: always() && steps.do_merge.outputs.status == 'conflict'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "⚠️ Auto-merge failed: conflict detected",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "attention"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} → main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Manual merge required. develop/main was NOT modified.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
