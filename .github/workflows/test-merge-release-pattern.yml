name: Auto-create release-to-develop PR

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * *'

jobs:
  create_pr:
    name: Detect release branch and open PR to develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Identify release branch
        id: release_branch
        run: |
          git fetch origin --prune
          BRANCH=$(git branch -r \
            | sed 's|origin/||' \
            | sed 's/^[[:space:]]*//' \
            | grep -E '^release/.*-[0-9]{4}$' \
            | sort -V \
            | tail -n1 \
            | xargs)
          if [ -z "$BRANCH" ]; then
            echo "No branch matching release/*-YYYY found. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Detected release branch: $BRANCH"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing diff
        if: steps.release_branch.outputs.found == 'true'
        id: diff_check
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          AHEAD=$(git rev-list --count main.."origin/$BRANCH")
          echo "Commits in $BRANCH not yet in main: $AHEAD"
          if [ "$AHEAD" -eq "0" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Check for merge conflicts
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'true'
        id: conflict_check
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          git checkout main
          git merge --no-commit --no-ff "origin/$BRANCH" > merge_output.txt 2>&1
          MERGE_EXIT=$?
          echo "---- merge_output.txt content ----"
          cat merge_output.txt
          echo "---- merge exit code: $MERGE_EXIT ----"

          if git diff --name-only --diff-filter=U | grep -q .; then
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "conflict_files=$CONFLICT_FILES" >> $GITHUB_OUTPUT
            echo "Conflicting files: $CONFLICT_FILES"
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

          git merge --abort 2>/dev/null || true

      - name: Check for existing open PR
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'true'
        id: pr_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open PR already exists: #$EXISTING. Skipping creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR and request review
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'true' && steps.pr_check.outputs.exists == 'false'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.release_branch.outputs.branch }}
          REVIEWERS: "SHARATH1992B"
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated merge: $BRANCH -> main" \
            --body "Auto-generated daily PR to merge the active release branch into main. Requires approval before merge." \
            --reviewer "$REVIEWERS")
          echo "PR created: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Report result
        if: always()
        run: |
          echo "Branch detected: ${{ steps.release_branch.outputs.branch }}"
          echo "Diff needed: ${{ steps.diff_check.outputs.needed }}"
          echo "PR already existed: ${{ steps.pr_check.outputs.exists }}"

      - name: Notify Teams that a PR was opened
        if: steps.create_pr.outcome == 'success'
        run: |
          if [ "${{ steps.conflict_check.outputs.has_conflicts }}" == "true" ]; then
            TITLE="⚠️ New PR awaiting review — Merge conflicts detected"
            TITLE_COLOR="attention"
            STATUS_TEXT="This PR has merge conflicts that must be resolved manually before it can be merged."
            CONFLICT_TEXT="Conflicting files: ${{ steps.conflict_check.outputs.conflict_files }}"
          else
            TITLE="🔔 New PR awaiting review"
            TITLE_COLOR="accent"
            STATUS_TEXT="Review requested. Merge is blocked until required approvals are met."
            CONFLICT_TEXT="No merge conflicts detected."
          fi

          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "'"$TITLE"'",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "'"$TITLE_COLOR"'"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} → main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "'"$STATUS_TEXT"'",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "'"$CONFLICT_TEXT"'",
                      "wrap": true,
                      "color": "warning"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${{ steps.create_pr.outputs.pr_url }}",
                      "wrap": true,
                      "color": "accent"
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams when nothing to merge
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'false'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "\u2705 Nothing to merge",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} \u2192 main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "main is already up to date. No PR needed today.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

        
