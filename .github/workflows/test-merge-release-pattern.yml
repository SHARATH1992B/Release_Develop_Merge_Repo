name: Auto-create release-to-develop PR

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * *'

jobs:
  create_pr:
    name: Detect release branch and open PR to develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # BRANCH DETECTION (same logic validated in the earlier POC)
      # Matches release/<anything>-<4-digit year>  e.g. release/1.1.0-2026
      # The leading-whitespace fix from before is included here too.
      # ============================================================
      - name: Identify release branch
        id: release_branch
        run: |
          git fetch origin --prune
          BRANCH=$(git branch -r \
            | sed 's|origin/||' \
            | sed 's/^[[:space:]]*//' \
            | grep -E '^release/.*-[0-9]{4}$' \
            | sort -V \
            | tail -n1 \
            | xargs)
          if [ -z "$BRANCH" ]; then
            echo "No branch matching release/*-YYYY found. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Detected release branch: $BRANCH"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # CHECK: is there actually anything new to merge?
      # Avoids opening a pointless PR if develop/main is already
      # up to date with the release branch (e.g. nothing changed
      # since yesterday's run).
      # ============================================================
      - name: Check for existing diff
        if: steps.release_branch.outputs.found == 'true'
        id: diff_check
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          AHEAD=$(git rev-list --count main.."origin/$BRANCH")
          echo "Commits in $BRANCH not yet in main: $AHEAD"
          if [ "$AHEAD" -eq "0" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # CHECK: is there already an OPEN PR for this branch?
      # Avoids spamming a new PR every single day if yesterday's
      # PR is still sitting there waiting for approval.
      # ============================================================
      - name: Check for existing open PR
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'true'
        id: pr_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open PR already exists: #$EXISTING. Skipping creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # CREATE THE PR + REQUEST REVIEW
      #
      # TEST PHASE: reviewer is just you (SHARATH1992B) for now.
      # Once validated, change REVIEWERS below to the 2 real team
      # lead GitHub usernames, comma-separated, no spaces.
      # ============================================================
      - name: Create PR and request review
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'true' && steps.pr_check.outputs.exists == 'false'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.release_branch.outputs.branch }}
          REVIEWERS: "SHARATH1992B"
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated merge: $BRANCH -> main" \
            --body "Auto-generated daily PR to merge the active release branch into main. Requires approval before merge." \
            --reviewer "$REVIEWERS")
          echo "PR created: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Report result
        if: always()
        run: |
          echo "Branch detected: ${{ steps.release_branch.outputs.branch }}"
          echo "Diff needed: ${{ steps.diff_check.outputs.needed }}"
          echo "PR already existed: ${{ steps.pr_check.outputs.exists }}"

      # ============================================================
      # TEAMS NOTIFICATION
      #
      # Fires only when a new PR was actually created this run.
      # Uses the same Adaptive Card format and Workflows webhook
      # approach validated in the earlier auto-merge POC.
      # ============================================================
      - name: Notify Teams that a PR was opened
        if: steps.create_pr.outcome == 'success'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "\ud83d\udd14 New PR awaiting review",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "accent"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} \u2192 main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Review requested. Merge is blocked until required approvals are met.",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "${{ steps.create_pr.outputs.pr_url }}",
                      "wrap": true,
                      "color": "accent"
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams when nothing to merge
        if: steps.release_branch.outputs.found == 'true' && steps.diff_check.outputs.needed == 'false'
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "\u2705 Nothing to merge",
                      "weight": "bolder",
                      "size": "medium",
                      "color": "good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: ${{ steps.release_branch.outputs.branch }} \u2192 main",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "main is already up to date. No PR needed today.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
