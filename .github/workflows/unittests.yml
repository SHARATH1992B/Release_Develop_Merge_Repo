name: Unit Tests

on:
  workflow_run:
    workflows: ["Install Dependencies"]
    types: [completed]

jobs:
  unittests:
    name: UnitTests
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Mark check as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Unit Tests / UnitTests',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress'
            });

      - name: Checkout the exact commit that triggered Install Dependencies
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # github.event.workflow_run.id is the exact run ID of the Install
      # Dependencies run that triggered this job - matches what that run
      # saved under. See note in sonar.yml - the cache may still not be
      # visible here due to actions/cache's branch-scoping rules across
      # workflow_run. The fallback below keeps this reliable either way.
      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ github.event.workflow_run.id }}

      - name: Install dependencies (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache not visible here - installing dependencies as a fallback."
          time npm ci

      - name: Confirm dependencies are present
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          du -sh node_modules

      - name: Run tests (JUnit output)
        id: run_tests
        run: npm run test:ci

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/junit.xml'
          commit: ${{ github.event.workflow_run.head_sha }}

      - name: Mark check as completed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.run_tests.outcome }}' === 'success' ? 'success' : 'failure';
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });
            const check = checks.data.check_runs.find(c => c.name === 'Unit Tests / UnitTests');
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: conclusion
              });
            }
