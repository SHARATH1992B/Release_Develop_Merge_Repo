name: Unit Tests

on:
  workflow_run:
    workflows: ["Install Dependencies"]
    types: [completed]

jobs:
  unittests:
    name: UnitTests
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - name: Mark check as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Unit Tests / UnitTests',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress'
            });

      - name: Checkout the exact commit that triggered Install Dependencies
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download node_modules artifact from Install Dependencies run
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz

      - name: Confirm dependencies were restored, not reinstalled
        run: du -sh node_modules

      # May exit non-zero if a test fails - that's expected and correct.
      - name: Run tests (JUnit output)
        id: run_tests
        run: npm run test:ci

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/junit.xml'
          commit: ${{ github.event.workflow_run.head_sha }}

      - name: Mark check as completed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.run_tests.outcome }}' === 'success' ? 'success' : 'failure';
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });
            const check = checks.data.check_runs.find(c => c.name === 'Unit Tests / UnitTests');
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: conclusion
              });
            }
