name: POC - Workflow B (reuse cached dependencies)

on:
  workflow_dispatch: {}

jobs:
  reuse_cache:
    name: Reuse cached dependencies instead of reinstalling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Same "path" and same "key" pattern as Workflow A. Because the cache is
      # stored at the repo level (not per-workflow-file), this step can restore
      # the exact same node_modules that Workflow A saved earlier - as long as
      # package-lock.json is unchanged.
      - name: Restore npm dependencies cache
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      # This should be skipped entirely if Workflow A already ran and cached
      # successfully - that's the whole point of this POC.
      - name: Install dependencies (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "No cache found - installing dependencies from scratch."
          time npm ci

      - name: Show result
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          echo "node_modules folder size:"
          du -sh node_modules
