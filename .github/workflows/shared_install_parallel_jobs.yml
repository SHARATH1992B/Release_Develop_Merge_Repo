name: Install Dependencies

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  install_deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore or save npm dependencies cache
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "No cache found - installing dependencies from scratch."
          time npm ci

      # Cache alone isn't reliable for handing off to workflow_run-triggered
      # jobs (Sonar/UnitTests), because their ref context differs from this
      # PR's branch, and cache restore is scoped by ref. An artifact is tied
      # to this specific run ID instead, so it's reliably downloadable
      # regardless of branch/ref context.
      - name: Package node_modules for downstream jobs
        run: tar -czf node_modules.tar.gz node_modules

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules.tar.gz
          retention-days: 1
