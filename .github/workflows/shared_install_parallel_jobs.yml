name: CI Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  # This job installs dependencies exactly once and saves them to a cache.
  # Both jobs below wait for this one to finish before they start.
  install_deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore or save npm dependencies cache
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "No cache found - installing dependencies from scratch."
          time npm ci

  # Stands in for the real "Sonar" job. It does NOT install anything itself -
  # it only restores what install_deps already cached.
  sonar_like:
    name: SonarCloud
    needs: install_deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      - name: Confirm dependencies were restored, not reinstalled
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          du -sh node_modules

      - name: Simulate Sonar-style analysis step
        run: echo "Running Sonar-like analysis using the already-installed dependencies..."

  # Stands in for the real "Unit Tests" job. Restores the cache (no reinstall),
  # then actually runs the tests and publishes an itemized result report.
  unittests_like:
    name: UnitTests
    needs: install_deps
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ hashFiles('package-lock.json') }}

      - name: Confirm dependencies were restored, not reinstalled
        run: |
          echo "Cache hit was: ${{ steps.cache.outputs.cache-hit }}"
          du -sh node_modules

      # This may exit non-zero if a test fails - that's expected and correct.
      - name: Run tests (JUnit output)
        run: npm run test:ci

      # if: always() ensures this still runs even if the step above failed,
      # so the itemized report shows up on the PR either way.
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/junit.xml'
