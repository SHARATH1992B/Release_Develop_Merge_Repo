name: Install Dependencies

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  install_deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # key uses github.run_id, which is unique to THIS workflow run. This
      # guarantees the cache step below never finds a pre-existing match, so
      # every PR (and every update to a PR) always installs fresh - no reuse
      # of a previous PR's cached dependencies.
      - name: Save npm dependencies cache (always a fresh key)
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-deps-${{ github.run_id }}

      - name: Install dependencies (always runs - key is always new)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Installing dependencies from scratch for this run."
          time npm ci
